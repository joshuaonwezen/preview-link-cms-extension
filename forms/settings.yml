sections:
  - key: site
    label: Site
    elements:
      - type: text
        key: siteUrl
        label: Site URL
        help: >-
          The front end that renders /preview/share for this CMS instance, e.g.
          https://optimizely-onboarding.vercel.app for joshCMS.
      - type: secret
        key: previewSecret
        label: Preview secret
        help: >-
          The site's OPTIMIZELY_PREVIEW_SECRET. Links are signed with it, and rotating it on the
          site revokes every link. Leave blank to keep the saved one.
      - type: button
        label: Save
        action: saveSite
        style: primary
  - key: cms
    label: CMS API client
    elements:
      - type: text
        key: clientId
        label: Client ID
        help: >-
          CMS → Settings → API Keys. Used to read the open item's versions and which
          variation each one belongs to.
      - type: secret
        key: clientSecret
        label: Client secret
        help: Shown once when the API key is created. Leave blank to keep the saved one.
      - type: button
        label: Save
        action: saveCms
        style: primary
