sections:
  - key: site
    label: Site
    elements:
      - type: text
        key: siteUrl
        label: Site URL
        help: >-
          The public https address of the website that shows these previews, for example
          https://www.example.com. Local addresses and IP addresses aren't accepted.
      - type: secret
        key: previewSecret
        label: Preview secret
        help: >-
          The preview secret the website was set up with (its OPTIMIZELY_PREVIEW_SECRET). Every
          link is signed with it, and changing it on the website turns off all links shared so
          far. Leave blank to keep the saved one.
      - type: button
        label: Save
        action: saveSite
        style: primary
  - key: cms
    label: CMS API client
    elements:
      - type: text
        key: clientId
        label: Client ID
        help: >-
          From CMS → Settings → API Keys. The app uses it to read the open page's versions and
          which variation each one belongs to.
      - type: secret
        key: clientSecret
        label: Client secret
        help: Shown once when the API key is created. Leave blank to keep the saved one.
      - type: button
        label: Save
        action: saveCms
        style: primary
